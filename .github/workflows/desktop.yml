name: Desktop app

# Builds every desktop artifact a release ships: the Tauri Windows installers,
# and the Chromium-free native client for Windows and Linux. Pushing a v* tag
# produces a DRAFT release with all of them attached, so you can review and
# edit the notes before it goes out. Run it manually to get them as workflow
# artifacts instead.
#
# It also runs on any change to either client. The bundle configuration — the
# NSIS hooks, the artwork, the WiX images — is only exercised when an installer
# is actually built, and finding out that a release cannot be packaged at the
# moment you tag it is finding out too late.

on:
  push:
    tags:
      - 'v*'
    branches:
      # The default branch was renamed; 'main' on its own stopped matching.
      - 'scopeddlol/main'
      - main
    # Deliberately no `paths` here. A path filter applies to tag pushes too,
    # and a tag whose commits happen not to touch desktop/ or native/ would
    # skip this workflow and open a release with nothing attached — or no
    # release at all. Pull requests below still get the filter, which is where
    # the noise would otherwise be.
  pull_request:
    paths:
      - 'desktop/**'
      - 'native/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build installers
        working-directory: desktop
        run: npm run build

      - name: List what was produced
        shell: bash
        working-directory: desktop
        run: |
          echo "### Installers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -print \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Uploaded before the release step so the binaries are retrievable even
      # if publishing fails.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minichat-windows-installers
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # The hooks only run when the installer runs, so this installs it,
      # checks what the hook was supposed to write, and uninstalls again.
      # Everything here happens on the runner's own user account, per-user
      # and without elevation, which is how the installer is configured.
      # Two things the generated script has to have: our hooks file, and the
      # macro from it inserted where Tauri calls it. A bundle that quietly
      # dropped the hook would otherwise look exactly like a hook that ran
      # and did nothing.
      - name: Check the hook reached the generated installer
        shell: pwsh
        working-directory: desktop
        run: |
          $script = "target/release/nsis/x64/installer.nsi"
          if (-not (Test-Path $script)) { throw "no generated script at $script" }
          $text = Get-Content $script -Raw
          if ($text -notmatch 'installer\\hooks\.nsh') {
              throw "the generated script does not include desktop/installer/hooks.nsh"
          }
          if ($text -notmatch 'insertmacro NSIS_HOOK_POSTINSTALL') {
              throw "the generated script never inserts NSIS_HOOK_POSTINSTALL"
          }
          Select-String -Path $script -Pattern 'hooks\.nsh', 'NSIS_HOOK_POSTINSTALL' |
              ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line.Trim())" }

      # The hook on its own, away from the app: same includes, same execution
      # level, same shell context, nothing else. When this passes and the
      # real installer below does not, the difference is Tauri's script, not
      # the hook.
      - name: Run the hook in isolation
        shell: pwsh
        working-directory: desktop/installer
        run: |
          $makensis = Get-ChildItem "$env:LOCALAPPDATA\tauri" -Recurse -Filter makensis.exe `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $makensis) { throw "no makensis under $env:LOCALAPPDATA\tauri" }
          Write-Host "using $($makensis.FullName)"

          & $makensis.FullName /V2 hooks-test.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

          $instance = 'https://hook-test.example.com'
          $run = Start-Process -FilePath (Resolve-Path ./hooks-test.exe) `
              -ArgumentList '/S', "/INSTANCE=$instance" -Wait -PassThru
          Write-Host "hook test exited with $($run.ExitCode)"

          # What the harness recorded on the way through, which is the only
          # window into a silent NSIS run.
          foreach ($note in 'parameters.txt', 'parsed.txt') {
              $path = "$env:TEMP\minichat-hook-test\$note"
              if (Test-Path $path) { Get-Content $path | ForEach-Object { Write-Host $_ } }
          }

          $settings = "$env:APPDATA\chat.mini.desktop\settings.json"
          for ($i = 0; $i -lt 15 -and -not (Test-Path $settings); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $settings)) {
              throw "the hook alone did not write $settings"
          }
          Get-Content $settings -Raw | Write-Host
          $saved = (Get-Content $settings -Raw | ConvertFrom-Json).instance_url
          if ($saved -ne $instance) { throw "hook wrote '$saved', expected '$instance'" }

          # Out of the way of the real installer below, which deliberately
          # leaves existing settings alone.
          Remove-Item "$env:APPDATA\chat.mini.desktop" -Recurse -Force
          Remove-Item "$env:TEMP\minichat-hook-test" -Recurse -Force
          Remove-Item ./hooks-test.exe -Force

      - name: Install, and check the installer's hooks
        shell: pwsh
        working-directory: desktop
        run: |
          function Show-Tree($label, $path) {
              Write-Host "--- $label ($path)"
              if (Test-Path $path) {
                  Get-ChildItem $path -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 40 -ExpandProperty FullName |
                      ForEach-Object { Write-Host "    $_" }
              } else {
                  Write-Host "    (does not exist)"
              }
          }

          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe |
              Select-Object -First 1
          $instance = 'https://chat.example.com'
          Write-Host "running $($setup.Name) /S /INSTANCE=$instance"
          $run = Start-Process -FilePath $setup.FullName `
              -ArgumentList '/S', "/INSTANCE=$instance" -Wait -PassThru
          $run.WaitForExit()
          Write-Host "installer exited with $($run.ExitCode)"

          # The folder is the product name and the executable is the Cargo
          # binary name: Tauri only renames the binary when `mainBinaryName`
          # says so, and this app does not set it.
          #
          # The wait is because a silent NSIS run can return while the last
          # writes are still landing.
          $exe = "$env:LOCALAPPDATA\MiniChat\minichat-desktop.exe"
          $settings = "$env:APPDATA\chat.mini.desktop\settings.json"
          for ($i = 0; $i -lt 30; $i++) {
              if ((Test-Path $exe) -and (Test-Path $settings)) { break }
              Start-Sleep 1
          }

          if (-not (Test-Path $exe)) {
              Show-Tree "install directory" "$env:LOCALAPPDATA\MiniChat"
              throw "the installer did not put the app at $exe"
          }
          Write-Host "installed: $exe"

          if (-not (Test-Path $settings)) {
              # Where the hook's own idea of %APPDATA% ended up, if anywhere.
              foreach ($root in $env:APPDATA, $env:LOCALAPPDATA, $env:PROGRAMDATA, "C:") {
                  Show-Tree "chat.mini.desktop" "$root\chat.mini.desktop"
              }
              throw "the /INSTANCE hook did not write $settings"
          }
          $saved = (Get-Content $settings -Raw | ConvertFrom-Json).instance_url
          if ($saved -ne $instance) {
              throw "settings.json says '$saved', expected '$instance'"
          }
          Write-Host "instance address seeded: $saved"

      - name: Uninstall, and check it kept the settings
        shell: pwsh
        run: |
          $uninstall = "$env:LOCALAPPDATA\MiniChat\uninstall.exe"
          if (-not (Test-Path $uninstall)) { throw "no uninstaller at $uninstall" }
          # The uninstaller copies itself out and returns, so -Wait is not
          # enough to know it has finished.
          Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\MiniChat\minichat-desktop.exe"
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "the app survived the uninstall: $exe" }

          # Tauri's uninstaller only deletes the app's data when its
          # checkbox is ticked, and an unattended uninstall never sees that
          # page — so a member who reinstalls does not have to sign in again.
          $settings = "$env:APPDATA\chat.mini.desktop\settings.json"
          if (-not (Test-Path $settings)) {
              throw "the silent uninstall deleted the saved settings"
          }
          Write-Host "settings kept, as an unattended uninstall should"

  # The Chromium-free client, for both platforms it runs on. Built with the
  # `voice` feature: without it the binary joins voice channels and carries no
  # audio, which is not a thing to hand someone as a chat client. That feature
  # is what the clang 21 step below is for — see native/README.md.
  native:
    name: Native client (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: x86_64-linux
          - os: windows-latest
            label: x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: release-voice

      # The UI's libraries, plus ALSA and glib for libwebrtc's audio module.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libglib2.0-dev

      # libwebrtc ships a hermetic libc++ that needs clang 21 to link, and
      # Ubuntu tops out at 18. Windows links against MSVC and needs none of it.
      - name: Install clang 21
        if: runner.os == 'Linux'
        run: |
          curl -sSLO https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          echo "CC=/usr/bin/clang-21" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-21" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Build
        working-directory: native
        run: cargo build --release --locked --features voice

      # A release binary that compiles and then draws nothing is the bug this
      # client has actually had. The software renderer needs no display, so the
      # check costs one frame.
      - name: Check it still renders
        if: runner.os == 'Linux'
        working-directory: native
        run: |
          ./target/release/minichat-native --screenshot release-check.png 1180 820
          size=$(stat -c%s release-check.png)
          echo "release-check.png: $size bytes"
          [ "$size" -gt 20000 ] || { echo "::error::the release build renders blank"; exit 1; }

      # The fonts are compiled into the binary, so their licences travel with
      # it rather than staying in the repository.
      - name: Package
        shell: bash
        working-directory: native
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          stage="minichat-native-${version}-${{ matrix.label }}"
          mkdir -p "$stage"
          cp README.md "$stage/"
          cp assets/fonts/*-LICENSE.txt "$stage/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/minichat-native.exe "$stage/"
            7z a -tzip "${stage}.zip" "$stage" > /dev/null
          else
            cp target/release/minichat-native "$stage/"
            tar czf "${stage}.tar.gz" "$stage"
          fi

          {
            echo "### Native client — ${{ matrix.label }}"
            echo '```'
            ls -lh "${stage}".* | sed 's/  */ /g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minichat-native-${{ matrix.label }}
          path: |
            native/*.zip
            native/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # One release, assembled from whatever the build jobs produced. Separate so
  # that a tag cannot open a half-empty release when one platform fails.
  release:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: [windows, native]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what is going to be attached
        run: |
          ls -lh dist
          {
            echo "### Release assets"
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: MiniChat ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.msi
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          body: |
            ## Install

            ### Self-host the server

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/compose.yml
            curl -o .env https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.env.example
            # fill in .env, then:
            docker compose up -d
            ```

            The container image for this release is published to GitHub
            Container Registry for `linux/amd64` and `linux/arm64`:

            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### Windows desktop app

            Download `.msi` (or the `.exe` setup) below. On first launch it asks
            for your instance address and remembers it.

            The installers are unsigned, so SmartScreen will warn on first run —
            choose **More info → Run anyway**, or sign them yourself with your
            own certificate.

            ### Native client (no browser engine)

            `minichat-native-*` is the Chromium-free client: one binary, around
            30 MB idle where the installer above holds several hundred. Unpack
            and run it — there is nothing to install beside it.

            - **Linux** — `minichat-native-*-x86_64-linux.tar.gz`. This is the
              only Linux client; the installer above is Windows-only. Needs
              fontconfig and the xkbcommon and xcb libraries, which a desktop
              system already has.
            - **Windows** — `minichat-native-*-x86_64-windows.zip`, a
              **preview**. The `.msi` remains the recommended Windows download
              until this client has been through accessibility testing.

            Voice audio works. **Camera and screen share do not** — use the
            installer above or the web client for those.

            ### Mobile

            Open your instance in a browser and add it to your Home Screen. On
            iPhone and iPad this is required for notifications to work at all.

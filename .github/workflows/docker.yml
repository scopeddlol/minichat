name: Docker image

# Builds and publishes the container image to GitHub Container Registry.
#
# Each architecture is built on a runner of that architecture rather than under
# QEMU, then the per-platform images are merged into one manifest. Emulating an
# arm64 Rust build costs half an hour; this costs the same as an amd64 build.
#
# Pull requests build and smoke-test the image without publishing anything.

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A second push to the same branch supersedes the first; tag builds always run.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 runners are free for public repositories.
            runner: ubuntu-24.04-arm

    steps:
      - name: Derive a filename-safe platform label
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the local daemon first so the image can actually be run
      # before it is published. On a native runner this exercises the real
      # binary for this architecture, not an emulated one.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: minichat:ci
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name minichat-ci \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -p 8080:8080 minichat:ci

          echo "Waiting for the server to come up…"
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "healthz responded after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" = "45" ]; then
              echo "::error::The container never became healthy"
              docker logs minichat-ci
              exit 1
            fi
            sleep 2
          done

          echo "--- /api/meta ---"
          meta=$(curl -fsS http://127.0.0.1:8080/api/meta)
          echo "$meta"
          # A freshly built image must boot into an un-set-up instance.
          echo "$meta" | grep -q '"setup_complete":false'

          echo "--- web client is served ---"
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root">'

          echo "--- migrations applied ---"
          docker logs minichat-ci 2>&1 | grep -qi 'listening on'

          docker rm -f minichat-ci
          echo "Smoke test passed on ${{ matrix.platform }}"

      # Publishes the single-platform image under its digest only; the merge
      # job below assembles the digests into the tagged manifest.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Attestations are added once, to the merged manifest.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MiniChat
            org.opencontainers.image.description=Self-hosted voice, video and text chat for a single community
            org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the published image
        id: inspect
        run: |
          set -euo pipefail
          ref='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}'
          docker buildx imagetools inspect "$ref"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo "Digest: \`${{ steps.inspect.outputs.digest }}\`"
            echo
            echo "Architectures: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Tauri shell

# The Tauri shell is no longer shipped — releases carry the native client
# alone (see release.yml). This is what keeps it from rotting while it is
# still in the tree: it builds, and nothing is published.

on:
  push:
    branches:
      - 'scopeddlol/main'
    paths:
      - 'desktop/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Builds on Windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install

      - name: Build installers
        working-directory: desktop
        run: npm run build

      - name: List what was produced
        shell: bash
        working-directory: desktop
        run: |
          echo "### Installers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find target/release/bundle -type f \( -name '*.msi' -o -name '*.exe' \) -print \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Nothing is kept: this is a check that the shell still builds, not a
      # source of downloads. The release ships the native client alone.

      - name: Check the hook reached the generated installer
        shell: pwsh
        working-directory: desktop
        run: |
          $script = "target/release/nsis/x64/installer.nsi"
          if (-not (Test-Path $script)) { throw "no generated script at $script" }
          $text = Get-Content $script -Raw
          if ($text -notmatch 'installer\\hooks\.nsh') {
              throw "the generated script does not include desktop/installer/hooks.nsh"
          }
          if ($text -notmatch 'insertmacro NSIS_HOOK_POSTINSTALL') {
              throw "the generated script never inserts NSIS_HOOK_POSTINSTALL"
          }
          Select-String -Path $script -Pattern 'hooks\.nsh', 'NSIS_HOOK_POSTINSTALL' |
              ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line.Trim())" }

      # The hook on its own, away from the app: same includes, same execution
      # level, same shell context, nothing else. When this passes and the
      # real installer below does not, the difference is Tauri's script, not
      # the hook.
      - name: Run the hook in isolation
        shell: pwsh
        working-directory: desktop/installer
        run: |
          $makensis = Get-ChildItem "$env:LOCALAPPDATA\tauri" -Recurse -Filter makensis.exe `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $makensis) { throw "no makensis under $env:LOCALAPPDATA\tauri" }
          Write-Host "using $($makensis.FullName)"

          & $makensis.FullName /V2 hooks-test.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

          $instance = 'https://hook-test.example.com'
          $run = Start-Process -FilePath (Resolve-Path ./hooks-test.exe) `
              -ArgumentList '/S', "/INSTANCE=$instance" -Wait -PassThru
          Write-Host "hook test exited with $($run.ExitCode)"

          # What the harness recorded on the way through, which is the only
          # window into a silent NSIS run.
          foreach ($note in 'parameters.txt', 'parsed.txt') {
              $path = "$env:TEMP\minichat-hook-test\$note"
              if (Test-Path $path) { Get-Content $path | ForEach-Object { Write-Host $_ } }
          }

          $settings = "$env:APPDATA\chat.mini.desktop\settings.json"
          for ($i = 0; $i -lt 15 -and -not (Test-Path $settings); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $settings)) {
              throw "the hook alone did not write $settings"
          }
          Get-Content $settings -Raw | Write-Host
          $saved = (Get-Content $settings -Raw | ConvertFrom-Json).instance_url
          if ($saved -ne $instance) { throw "hook wrote '$saved', expected '$instance'" }

          # Out of the way of the real installer below, which deliberately
          # leaves existing settings alone.
          Remove-Item "$env:APPDATA\chat.mini.desktop" -Recurse -Force
          Remove-Item "$env:TEMP\minichat-hook-test" -Recurse -Force
          Remove-Item ./hooks-test.exe -Force

      - name: Install, and check the installer's hooks
        shell: pwsh
        working-directory: desktop
        run: |
          function Show-Tree($label, $path) {
              Write-Host "--- $label ($path)"
              if (Test-Path $path) {
                  Get-ChildItem $path -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 40 -ExpandProperty FullName |
                      ForEach-Object { Write-Host "    $_" }
              } else {
                  Write-Host "    (does not exist)"
              }
          }

          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe |
              Select-Object -First 1
          $instance = 'https://chat.example.com'
          Write-Host "running $($setup.Name) /S /INSTANCE=$instance"
          $run = Start-Process -FilePath $setup.FullName `
              -ArgumentList '/S', "/INSTANCE=$instance" -Wait -PassThru
          $run.WaitForExit()
          Write-Host "installer exited with $($run.ExitCode)"

          # The folder is the product name and the executable is the Cargo
          # binary name: Tauri only renames the binary when `mainBinaryName`
          # says so, and this app does not set it.
          #
          # The wait is because a silent NSIS run can return while the last
          # writes are still landing.
          $exe = "$env:LOCALAPPDATA\MiniChat\minichat-desktop.exe"
          $settings = "$env:APPDATA\chat.mini.desktop\settings.json"
          for ($i = 0; $i -lt 30; $i++) {
              if ((Test-Path $exe) -and (Test-Path $settings)) { break }
              Start-Sleep 1
          }

          if (-not (Test-Path $exe)) {
              Show-Tree "install directory" "$env:LOCALAPPDATA\MiniChat"
              throw "the installer did not put the app at $exe"
          }
          Write-Host "installed: $exe"

          if (-not (Test-Path $settings)) {
              # Where the hook's own idea of %APPDATA% ended up, if anywhere.
              foreach ($root in $env:APPDATA, $env:LOCALAPPDATA, $env:PROGRAMDATA, "C:") {
                  Show-Tree "chat.mini.desktop" "$root\chat.mini.desktop"
              }
              throw "the /INSTANCE hook did not write $settings"
          }
          $saved = (Get-Content $settings -Raw | ConvertFrom-Json).instance_url
          if ($saved -ne $instance) {
              throw "settings.json says '$saved', expected '$instance'"
          }
          Write-Host "instance address seeded: $saved"

      - name: Uninstall, and check it kept the settings
        shell: pwsh
        run: |
          $uninstall = "$env:LOCALAPPDATA\MiniChat\uninstall.exe"
          if (-not (Test-Path $uninstall)) { throw "no uninstaller at $uninstall" }
          # The uninstaller copies itself out and returns, so -Wait is not
          # enough to know it has finished.
          Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\MiniChat\minichat-desktop.exe"
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "the app survived the uninstall: $exe" }

          # Tauri's uninstaller only deletes the app's data when its
          # checkbox is ticked, and an unattended uninstall never sees that
          # page — so a member who reinstalls does not have to sign in again.
          $settings = "$env:APPDATA\chat.mini.desktop\settings.json"
          if (-not (Test-Path $settings)) {
              throw "the silent uninstall deleted the saved settings"
          }
          Write-Host "settings kept, as an unattended uninstall should"

  # The Chromium-free client, for both platforms it runs on. Built with the
  # `voice` feature: without it the binary joins voice channels and carries no
  # audio, which is not a thing to hand someone as a chat client. That feature
  # is what the clang 21 step below is for — see native/README.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Check formatting
        working-directory: server
        run: cargo fmt --check
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: server
        run: cargo test --locked
      - name: Build
        working-directory: server
        run: cargo build --release --locked
      - name: Release integration smoke test
        run: python3 server/tests/release_smoke.py server/target/release/minichat-server

  # Runs on Windows because that is the only target that ships, and because the
  # parts most likely to break — the WebView2 permission hook and the tray —
  # only compile there. Two broken Tauri releases got out before this job
  # existed; the point is that a push tells you now, not after a tag.
  desktop:
    name: Desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: desktop
        run: cargo test --locked

  # The Rust + Slint client. Built on Linux as well as Windows: Windows is
  # what ships, and Linux is where the headless screenshot runs, which is the
  # only check that the interface still lays out rather than merely compiles.
  native:
    name: Native client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Check formatting
        working-directory: native
        run: cargo fmt --check
      - name: Clippy
        working-directory: native
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: native
        run: cargo test --locked
      - name: Build
        working-directory: native
        run: cargo build --release --locked
      # Renders a populated window through the software renderer. Catches the
      # class of break that compiles cleanly and then lays out as nothing —
      # which has happened more than once in this client's short life.
      - name: Render the interface headlessly
        if: runner.os == 'Linux'
        working-directory: native
        run: |
          for overlay in "" settings profile emoji menu search inbox editing attaching scrolled; do
            if [ -z "$overlay" ]; then
              ./target/release/minichat-native --screenshot "shot-chat.png" 1180 820
            else
              ./target/release/minichat-native \
                --screenshot "shot-$overlay.png" 1180 820 --overlay "$overlay"
            fi
          done
          ./target/release/minichat-native --screenshot shot-light.png 1180 820 light
          # A blank or missing render is a failure, not a pass.
          for file in shot-*.png; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            [ "$size" -gt 20000 ] || { echo "$file looks empty"; exit 1; }
          done
      - name: Upload the renders
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-client-renders
          path: native/shot-*.png

  # The native client against a real server. Every other test in that crate
  # would pass against a server that changed the shape of READY; this is the
  # one that would not.
  native-integration:
    name: Native client against a real server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            native
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build the server
        working-directory: server
        run: cargo build --release --locked
      - name: Build the client
        working-directory: native
        run: cargo build --release --locked
      - name: Sign in, read the gateway, render
        run: |
          native/tests/live.sh \
            server/target/release/minichat-server \
            native/target/release/minichat-native

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Regression tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install browser for interaction tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        working-directory: web
        run: npm run test:browser

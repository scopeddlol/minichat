name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Check formatting
        working-directory: server
        run: cargo fmt --check
      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: server
        run: cargo test --locked
      - name: Build
        working-directory: server
        run: cargo build --release --locked
      - name: Release integration smoke test
        run: python3 server/tests/release_smoke.py server/target/release/minichat-server

  # Runs on Windows because that is the only target that ships, and because the
  # parts most likely to break — the WebView2 permission hook and the tray —
  # only compile there. Two broken Tauri releases got out before this job
  # existed; the point is that a push tells you now, not after a tag.
  desktop:
    name: Desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: desktop
        run: cargo test --locked

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

[package]
name = "minichat-desktop"
version = "0.1.0"
edition = "2021"
description = "MiniChat desktop client"
authors = ["MiniChat"]
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

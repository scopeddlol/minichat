# Build MiniChat from source instead of pulling the published image.
#
#   docker compose -f compose.yml -f compose.build.yml up -d --build
#
# Worth using if you have local changes, or if you would simply rather compile
# the thing you are about to run. Expect the first build to take a few minutes
# while Rust compiles; afterwards Docker's layer cache makes it quick.

services:
  minichat:
    build:
      context: .
      dockerfile: Dockerfile
    image: minichat:local
    pull_policy: never

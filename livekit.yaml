# LiveKit SFU configuration. API keys come from the LIVEKIT_KEYS environment
# variable set in compose.yml, so no secrets live in this file.

port: 7880
log_level: info

rtc:
  # Must match the published ports in compose.yml.
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # Required when running behind Docker's NAT so clients receive the host's
  # real address in ICE candidates.
  use_external_ip: true

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

turn:
  # LiveKit's built-in TURN relay. Off by default because it needs its own
  # certificate; enable it if members sit behind firewalls that block UDP and
  # the TCP fallback on 7881.
  enabled: false
  domain: ""
  tls_port: 5349

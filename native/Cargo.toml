[package]
name = "minichat-native"
version = "0.6.0"
edition = "2021"
description = "MiniChat native desktop client — no browser engine"
authors = ["MiniChat"]
rust-version = "1.82"
default-run = "minichat-native"

[dependencies]
slint = { version = "~1.18", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "renderer-software",
    "std",
    # Registering the bundled faces at run time. Slint 1.18 exposes the shared
    # fontique collection only behind this flag; the alternative is pointing
    # SLINT_FONT_PATH at files on disk, which a single-binary client does not
    # have. Pinned with `~` so a minor bump cannot silently drop it.
    "unstable-fontique-011",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "multipart",
    "stream",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "5"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ttf-parser = "0.25"
rustybuzz = "0.20"
unicode-segmentation = "1"
percent-encoding = "2"
url = "2"
# Slint 1.18 exposes no clipboard API, and "copy message text" is not a
# feature worth dropping over it.
arboard = { version = "3", default-features = false }
livekit = { version = "0.7", optional = true }

[features]
default = []
# The media half of voice: `livekit`, and under it roughly 200MB of prebuilt
# libwebrtc. Off by default because it needs clang 21 or newer to link on
# Linux, and because everything else in this client builds and tests without
# it. See src/voice.rs.
voice = ["dep:livekit"]

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
